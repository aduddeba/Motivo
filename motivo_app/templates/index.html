<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Your Dream Car</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(120deg, #1b1b1b, #333);
        color: white;
        font-family: "Poppins", sans-serif;
        margin: 0;
      }

      .container {
        display: flex;
        flex-direction: column; /* ✅ vertical layout */
        align-items: center; /* ✅ horizontally center inner items */
        text-align: center;
        max-width: 600px;
        padding: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5em;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.5em;
        color: #ccc;
        margin-bottom: 2em;
      }

      button {
        background-color: #e63946;
        border: none;
        padding: 0.7em 1.4em; /* ✅ shorter button */
        border-radius: 8px;
        font-size: 1.1rem;
        color: white;
        cursor: pointer;
        transition: 0.3s;
        width: fit-content; /* ✅ button shrinks to text */
      }

      button:hover {
        background-color: #f65c6b;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Find Your Dream Car</h1>
      <p>
        Answer a few quick questions and discover which car truly fits your
        personality, preferences, and lifestyle.
      </p>
      <button onclick="window.location.href='/quiz'">Start Quiz</button>
    </div>
  </body>
</html>
