<!DOCTYPE html>
<html>
  <head>
    <title>Motivo - Results</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <h1 style="text-align: center; color: blue">Search Results</h1>

    {% if results %}
    <ul style="text-align: center; list-style: none; padding: 0">
      {% for car in results %}
      <li>
        <a href="{{ car.url }}" target="_blank"
          >{{ car.make }} {{ car.model }}</a
        >
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p style="text-align: center">Sorry! No vehicles match your requirements</p>
    {% endif %}

    <div style="text-align: center; margin-top: 20px">
      <a href="{{ url_for('index') }}">🔙 Back to Search</a>
    </div>
  </body>
</html>
